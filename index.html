<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Softshade</title>
    <meta name="description" content="Softshade makes small browser games, including Worm Game, a daily word ladder puzzle.">
    <link rel="canonical" href="https://soft-shade.github.io/">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
      html, body { margin: 0; padding: 0; min-height: 100%; }
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 2rem 1.25rem;
        box-sizing: border-box;
        background: #1e1e2e;
        color: #cdd6f4;
        font-family: 'Inter', system-ui, sans-serif;
        line-height: 1.5;
      }
      main { max-width: 34rem; }
      h1 { margin: 0 0 0.75rem; font-size: 2rem; font-weight: 600; }
      p  { margin: 0 0 1.5rem; color: #a6adc8; }
      ul { margin: 0; padding: 0; list-style: none; }
      li { margin-bottom: 1rem; }
      a  { color: #cdd6f4; font-weight: 600; text-decoration: none; border-bottom: 1px solid #6c7086; }
      a:hover { border-bottom-color: #cdd6f4; }
      .desc { display: block; margin-top: 0.25rem; color: #6c7086; font-weight: 400; }
    </style>
  </head>
  <body>
    <main>
      <h1>Softshade</h1>
      <p>Small browser games, made by Softshade and friends.</p>
      <ul>
        <li>
          <a href="/worm-game/">Worm Game</a>
          <span class="desc">
            A daily word ladder puzzle. Get from the start word to the goal
            word by adding, removing, or changing one letter at a time,
            keeping every step a valid English word.
          </span>
        </li>
      </ul>
    </main>
  </body>
</html>
